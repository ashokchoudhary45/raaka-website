name: RAAKA Sun Pictures Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest 3 Sun Pictures posts
        env:
          SUN_PICTURES_SOURCE_URL: ${{ secrets.SUN_PICTURES_SOURCE_URL }}
        run: python scripts/sun_pictures_tracker.py

      - name: Commit feed changes
        run: |
          git config user.name "raaka-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sun-pictures-raaka.json
          git diff --cached --quiet || git commit -m "update RAAKA social feed"
          git push
