name: RAAKA BookMyShow Tracker

on:
  schedule:
    # Runs daily at 10:00 AM IST (04:30 UTC)
    - cron: "30 4 * * *"

  workflow_dispatch:

jobs:
  track-bookmyshow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./raaka-tracker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: raaka-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run BookMyShow tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node index.js