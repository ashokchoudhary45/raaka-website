<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raaka Movie Interest Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        table { margin: 0 auto; border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Raaka Movie - Day Wise Interest Count</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Interest / Likes Count</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data yahan JavaScript se load hoga -->
        </tbody>
    </table>

    <!-- Supabase CDN JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'AAPKA_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'AAPKA_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchInterests() {
            const { data, error } = await supabase
                .from('raaka_interests')
                .select('*')
                .order('date', { ascending: false });

            if (error) {
                console.error('Error fetching data:', error);
                return;
            }

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach(row => {
                tbody.innerHTML += 
                    <tr>
                        <td>${row.date}</td>
                        <td>${row.interest_count}</td>
                    </tr>
                ;
            });
        }

        fetchInterests();
    </script>
</body>
</html>
